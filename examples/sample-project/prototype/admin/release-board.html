<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="prototype-title" content="发布看板" />
    <meta name="prototype-path" content="release-board" />
    <meta name="prototype-section" content="workspace" />
    <meta name="prototype-icon" content="DataBoard" />
    <title>发布看板</title>
    <style>
      :root {
        --app-color-primary: #007aff;
        --app-color-surface: #ffffff;
        --app-color-border: #e5e7eb;
        --app-color-text: #111827;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f5f7fb;
        color: var(--app-color-text);
      }
      .release-board {
        padding: 24px 28px 32px;
      }
      .release-board__list {
        border: 1px solid var(--app-color-border);
        border-radius: 14px;
        background: var(--app-color-surface);
      }
      .release-board__item {
        display: flex;
        justify-content: space-between;
        padding: 18px 20px;
      }
      .release-board__item + .release-board__item {
        border-top: 1px solid var(--app-color-border);
      }
      .release-board__status {
        color: var(--app-color-primary);
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <!-- [AI-EDIT] PAGE_CONTENT_START -->
    <main class="release-board" data-page-content data-business-content>
      <h1>发布看板</h1>
      <section class="release-board__list" aria-label="版本状态">
        <div class="release-board__item">
          <span>需求确认</span><span class="release-board__status">已完成</span>
        </div>
        <div class="release-board__item">
          <span>原型评审</span><span class="release-board__status">进行中</span>
        </div>
      </section>
    </main>
    <!-- PAGE_CONTENT_END -->
    <!-- [AI-EDIT] PAGE_OVERLAYS_START -->
    <div hidden data-page-overlay></div>
    <!-- PAGE_OVERLAYS_END -->
    <script id="prototype-page-manifest" type="application/json">
      {
        "templateVersion": 1,
        "scriptMode": "native",
        "pageKey": "release-board",
        "pageTitle": "发布看板",
        "fileName": "release-board.html",
        "pageType": "dashboard",
        "pageHeaderMode": "standard",
        "client": "admin",
        "routePath": "/admin/release-board",
        "menuSection": "workspace",
        "menuTitle": "发布看板",
        "menuIcon": "DataBoard",
        "menu": true,
        "rootClass": "release-board",
        "overlayRootClass": "release-board-dialog",
        "contentSelector": "[data-page-content]",
        "businessContentSelector": "[data-business-content]",
        "overlaySelector": "[data-page-overlay]",
        "styleSelector": "style",
        "dependencies": [],
        "assets": []
      }
    </script>
    <script>
      /* [AI-EDIT] PAGE_LOGIC_START */
      const releaseBoardReady = true;
      void releaseBoardReady;
      /* PAGE_LOGIC_END */
    </script>
  </body>
</html>
