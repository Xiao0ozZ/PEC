      HTML 原型 AI 编写协议 v1.9（修改页面前必须完整阅读）

      目标
      - 本模板用于创建一份完整、可直接在浏览器打开的桌面端后台业务 HTML 页面。登录/认证页独立创建，仅复用适用的主题变量、字体和控件规范，不复用本模板锁定的后台外壳；已有页面优先在原文件中定向修改。
      - 可将本模板复制为多个 HTML 文件组成多页面原型；每个文件都必须能够单独打开和运行。
      - 复制本文件创建新页面，并以本模板作为唯一的结构与实现基准；不要另建或替换壳层、全局样式及启动代码。
      - 交付物必须是 UTF-8 的完整有效 HTML；不要把解释、Markdown 代码围栏、占位 TODO 或无关 Prompt 写入文件。
      - 统一运行依赖通过固定版本 CDN 加载；直接打开页面时需要能够访问这些 CDN 地址。

      执行顺序
      1. 先确认页面用途、信息层级、主要操作、必要状态和弹窗，再开始改代码。
      2. 先更新页面身份和 SHELL_NAV，再依次修改 PAGE_STYLE、PAGE_CONTENT、PAGE_OVERLAYS、PAGE_LOGIC。
      3. 完成后按“交付自检”逐项核对；不要只保证页面看起来能打开。

      不可破坏的模板契约
      - PROTOTYPE_AI_PROTOCOL_START/END 及其间的协议标题和全部正文必须完整保留；不得只保留版本标题，也不得压缩、摘要、改写或删除协议内容。
      - [TEMPLATE-LOCK] 区域、所有 START/END 标记、#app、prototype-page-manifest 和启动代码不得删除、改名或移动。
      - 只修改 [AI-EDIT] 区域和带 data-shell-* 的外壳文字；外壳骨架、统一依赖和基础样式保持不变。
      - 如需更换页面主题，只修改 THEME_TOKENS 区域中的强调色与结构色变量，并同步更新全部主色派生变量；不要修改基础样式实现。
      - 页面颜色必须使用 --app-color-* 或 --el-* 语义变量，不要在 PAGE_STYLE 中固定写死页面背景、面板背景、文字、边框和状态色。页面默认使用浅色；运行环境可以通过 html[data-theme="light"] 或 html[data-theme="dark"] 提供浅色或深色主题，页面不得删除主题桥接区。
      - 除模板自带的结构演示分支外，本文件只承载一个桌面端后台业务页面；正式交付时不得保留多个页面结构或改造成登录页、移动端页面。
      - 页面必须且只能有一个 data-page-content、一个 data-business-content；弹窗和抽屉统一放在 PAGE_OVERLAYS 区域。

      页面身份必须同步
      - prototype-page-manifest 是本文件内的页面身份 JSON；按字段用途更新值，不删除字段或改变 JSON 结构。
      - pageKey、rootClass、data-page-root、data-page-key 与页面内容根类使用同一 kebab-case 值。
      - 页面 CSS 以 .{rootClass} 开头；弹窗/抽屉 CSS 以 .{overlayRootClass} 开头，不写无作用域的页面样式。
      - client 是页面所属端的标识；必须等于 routePath 第一段，routePath 使用 /{client}/{page-path}。
      - <title>、manifest.pageTitle、manifest.menuTitle、正式页面实际保留的 H1 和 data-shell-page-title 文案保持一致。
      - fileName 使用当前 HTML 文件名并保留 .html 后缀；同一组页面中的文件名不得重复。
      - menuSection、menuTitle、menuIcon 和 menu 描述导航信息；不显示导航项时仅将 menu 设为 false。
      - scriptMode、选择器、dependencies 和 assets 属于固定技术字段，没有明确要求时保持原值。
      - pageHeaderMode 仅使用 standard、back-only 或 none；none 时删除整个 data-page-header。
      - pageType 与 data-layout-type 使用同一套取值：list、detail、form、dashboard、console、config 或 custom；无法准确归类时用 custom。
      - templateVersion 是当前模板结构协议的稳定版本号，必须保持为数字 1；协议标题中的 v1.9 是 AI 编写协议修订号，二者不要混用。创建页面时不修改。

      页面结构选择
      - 模板内容区提供“一级列表页、二级详情页、二级新增/编辑页”三种可切换结构示例；它们只用于说明结构，不代表一个文件应同时承载三个业务页面。
      - 创建正式页面时只选择一种结构，删除模板演示切换器、其余示例分支以及不再使用的样式、状态和方法。
      - 一级列表、配置、看板和控制台等独立功能页通常使用 standard；data-page-header 可放页面 H1、简短说明和页面级主操作。
      - 独立打开的详情、新增和编辑等二级页面通常使用 back-only；data-page-header 只能保留返回入口，不放页面 H1、说明、状态或页面级主操作。
      - 二级页面如需显示对象名称、编号、业务状态、表单标题或主要操作，应放在 data-business-content 的业务区块中；具体信息和布局由业务需求决定。
      - 二级新增或编辑页在返回入口后直接进入表单或流程内容，不额外建立页面标题区；表单内部可按业务需要设置区块标题。
      - 弹窗或抽屉中的新增、编辑不属于独立二级页面，应保留当前页面上下文，不额外生成返回区。

      HTML、Vue 与交互规则
      - data-page-header 只约定页面标题、说明和页面级操作的位置，不约定其后的业务内容结构。
      - data-business-content 内的现有代码只是可运行示例，可按业务需求完整替换其结构、组件、信息层级和交互方式；替换时同步更新 PAGE_STYLE、PAGE_OVERLAYS 和 PAGE_LOGIC，并删除不再使用的示例代码。
      - 页面状态、计算属性、方法和模拟数据只能写在 PAGE_LOGIC 中；使用 Vue 3 Composition API，不在 PAGE_LOGIC 中新增 window 全局变量。
      - SHELL_NAV 默认只作为视觉导航示例，不得添加指向不存在文件的链接或虚构跳转路径。
      - 只有确认目标 HTML 文件真实存在且确实需要跳转时，才使用标准相对链接，例如 <a href="./目标页面.html">；禁止使用 window.location 实现页面跳转。
      - PAGE_LOGIC 中禁止 onclick 等内联事件、直接操作 DOM、jQuery、未声明依赖和重复初始化 Vue；外壳的菜单图标渲染是模板自带的锁定实现，不受此条约束，也不要改写。
      - Element Plus 及自定义组件必须显式闭合；表单控件使用可见标签或 aria-label，图标按钮同时提供 Tooltip 和 aria-label。
      - 紧凑工具操作可使用图标按钮；查看、编辑、删除、审核、停用等业务操作使用清晰文字，不只依赖图标或颜色。
      - 异步操作必须处理校验失败、用户取消和 loading 复位；模拟数据应确定、可读，不调用真实接口或写入持久存储。

      CSS 与视觉规则
      - 页面专属样式只写在 PAGE_STYLE；优先使用 --app-* 与 --el-* 变量，间距和圆角走 --app-space-* 与 --app-radius-* 刻度，不新增全局样式、CDN、外部字体或外部图片。
      - 默认使用浅色中性外壳与 Apple 风格交互蓝；项目需要其他主题时，可修改 THEME_TOKENS，但应保持结构背景克制，并让强调色主要服务于操作、焦点和选中状态。
      - 内容区的页面背景、面板、文字、边框、悬浮层和成功/警告/危险状态必须引用语义变量；禁止在 PAGE_STYLE 中直接使用白色、黑色或固定灰色替代这些变量。独立打开时没有 data-theme 也必须正常显示浅色页面。
      - 页面标题 24px、区块标题 16px、正文/表格/表单/详情字段 14px、辅助信息 12-13px；不依赖浏览器默认字号。
      - 内容区的布局、组件和视觉组织由当前业务需求决定；统一使用模板主题变量，并保持信息层级、间距和交互状态清晰一致。
      - 桌面端宽度约定：外壳自适应，不给文档设 min-width，也不产生整页横向滚动。1080px 以下侧边栏收成图标栏、内容区控件降级，1180px 以下两栏布局收成单栏；过宽的表格在自身面板内横向滚动。页面级主操作在任何宽度下都必须可见可点，不要改成移动端布局。

      交付自检
      - 协议块仍完整存在，见“不可破坏的模板契约”第一条。
      - THEME_TOKENS 只包含完整的强调色、派生色和外壳结构色，没有把页面布局或业务样式写入其中。
      - 主题桥接区仍完整存在；页面没有把内容区颜色硬编码为单一主题，设置 html[data-theme="dark"] 后文字、背景、面板、边框和状态色仍有足够对比度。
      - HTML 可直接打开；控制台无错误；加载、空数据、校验、取消、确认和分页等已用状态均可操作。
      - 多页面原型中的相对链接均指向实际存在的文件，当前页面导航项带 is-active 和 aria-current="page"。
      - Manifest 是有效 JSON，页面身份字段一致，所有 Vue 模板表达式引用的状态和方法都在 pageSetup 返回。
      - 没有修改锁定区、没有新增第二份壳层、没有重复 data-page-* 标记、没有遗留无用代码或未使用状态。
    -->

            if (!icon) return;
            window.Vue.render(window.Vue.h(icon), host);

    <script data-page-script>
      /* [AI-EDIT] PAGE_LOGIC_START: 页面状态、计算属性、方法和模拟数据。 */
function pageSetup() {
const { createApp, ref, reactive, computed } = Vue;

        // 权限组组件
        const PermissionGroup = {
            props: ['title', 'permissions', 'modelValue'],
            emits: ['update:modelValue'],
            template: `
                <div class="mb-6">
                    <h3 class="font-bold text-gray-700 mb-3 border-l-4 border-[color:var(--app-color-primary)] pl-3 leading-none">{{ title }}</h3>
                    <div class="grid grid-cols-3 gap-4">
                        <label v-for="perm in permissions" :key="perm.id" 
                            class="flex items-start p-3 rounded border border-gray-200 hover:border-[color:var(--app-color-primary-light-7)] hover:bg-gray-50 cursor-pointer transition-all">
                            <input type="checkbox" :value="perm.id" 
                                :checked="modelValue.includes(perm.id)"
                                @change="togglePermission(perm.id)"
                                class="mt-1 mr-2 w-4 h-4 text-[color:var(--app-color-primary)] rounded focus:ring-[color:var(--app-color-primary)]">
                            <div>
                                <div class="font-medium text-gray-800 text-sm">{{ perm.name }}</div>
                                <div class="text-xs text-gray-400 mt-0.5">{{ perm.desc }}</div>
                            </div>
                        </label>
                    </div>
                </div>
            `,
            setup(props, { emit }) {
                const togglePermission = (id) => {
                    const newValue = [...props.modelValue];
                    const index = newValue.indexOf(id);
                    if (index > -1) {
                        newValue.splice(index, 1);
                    } else {
                        newValue.push(id);
                    }
                    emit('update:modelValue', newValue);
                };
                return { togglePermission };

                const icons = [
                    'Van', 'Ticket', 'DocumentAdd', 'List', 'Document', 'PriceTag',
                    'Grid', 'ShoppingCart', 'Setting', 'Location', 'Briefcase',
                    'HomeFilled', 'Check', 'UserFilled', 'Lock', 'Key', 'Plus'
                ];

                // 模拟角色数据
                const roles = ref([
                    { id: 2, code: 'SYS_ADMIN', name: '系统管理员', description: '负责用户管理、系统参数配置及日志审计', isSystem: true, scopes: ['SYSTEM_GLOBAL'], permissions: ['sys.user.manage', 'sys.role.manage', 'sys.log.view'] },
                    { id: 3, code: 'STORE_MGR', name: '门市店长', description: '负责门店日常运营、车辆排程看板及订单处理', isSystem: false, type: 'STORE', scopes: ['STORE_STANDARD', 'STORE_24H'], permissions: ['store.order.view', 'store.order.create', 'store.order.edit'] },
                    { id: 4, code: 'SHARING_OPS', name: '分时运营经理', description: '负责分时租赁业务的运力调度及网点管理', isSystem: false, type: 'STATION', scopes: ['SHARING_ROUND', 'SHARING_ONEWAY'], permissions: ['sharing.monitor', 'sharing.remote'] },
                    { id: 5, code: 'FINANCE', name: '财务专员', description: '负责全业务线的营收核对与报表导出', isSystem: false, type: 'HEADQUARTERS', scopes: ['SHARING_ROUND', 'SHARING_ONEWAY', 'STORE_STANDARD', 'STORE_24H', 'GOV_FLEET'], permissions: ['store.financial.view', 'gov.financial.view'] }
                ]);

                // 模拟权限定义 (Permissions Definition)
                const permissions = reactive({
                    SHARING_ROUND: {
                        ORDER: [
                            { id: 'sharing.round.order.view', name: '查看订单', desc: '查看同站分时订单列表及详情' },
                            { id: 'sharing.round.order.finish', name: '强制还车', desc: '处理异常订单，强制结束计费' }
                        ],
                        VEHICLE: [
                            { id: 'sharing.round.vehicle.monitor', name: '状态监控', desc: '查看车辆位置、电量及状态' },
                            { id: 'sharing.round.vehicle.remote', name: '远程控车', desc: '远程开锁、关锁、鸣笛寻车' }
                        ],
                        PRICING: [
                            { id: 'sharing.round.pricing.view', name: '查看价格', desc: '查看分时计费规则' },
                            { id: 'sharing.round.pricing.edit', name: '修改费率', desc: '调整分时租赁价格表' }
                        ]
                    },
                    SHARING_ONEWAY: {
                        DISPATCH: [
                            { id: 'sharing.oneway.dispatch.view', name: '查看调度单', desc: '查看异地还车调度任务' },
                            { id: 'sharing.oneway.dispatch.create', name: '创建调度', desc: '手动创建车辆排程看板工单' }
                        ],
                        STATION: [
                            { id: 'sharing.oneway.station.manage', name: '网点管理', desc: '新增或调整还车网点围栏' }
                        ]
                    },
                    STORE_STANDARD: {
                        ORDER: [
                            { id: 'store.std.order.view', name: '查看订单', desc: '查看门市订单列表' },
                            { id: 'store.std.order.create', name: '新建订单', desc: '录入新的门市租赁订单' },
                            { id: 'store.std.order.edit', name: '编辑订单', desc: '修改订单信息、延期等' },
                            { id: 'store.std.order.delete', name: '删除订单', desc: '删除无效或测试订单' }
                        ],
                        VEHICLE: [
                            { id: 'store.std.vehicle.inspec', name: '整备检查', desc: '录入车辆整备、清洗记录' }
                        ],
                        FINANCIAL: [
                            { id: 'store.std.financial.pos', name: 'POS结算', desc: '处理线下POS机刷卡收款' },
                            { id: 'store.std.financial.auth', name: '预授权管理', desc: '发起或撤销信用卡预授权' }
                        ]
                    },
                    STORE_24H: {
                        DEVICE: [
                            { id: 'store.24h.device.monitor', name: '设备监控', desc: '监控自助钥匙柜及车辆状态' }
                        ],
                        ORDER: [
                            { id: 'store.24h.order.intervention', name: '人工介入', desc: '处理自助取还车过程中的异常' }
                        ]
                    },
                    GOV_FLEET: {
                        APPROVAL: [
                            { id: 'gov.approval.view', name: '查看审批', desc: '查看公务用车审批进度' },
                            { id: 'gov.approval.audit', name: '审批订单', desc: '审核公务用车申请' }
                        ],
                        FINANCIAL: [
                            { id: 'gov.financial.bill', name: '月结账单', desc: '生成企业客户月结对账单' }
                        ]
                    },
                    SYSTEM_GLOBAL: {
                        ORG: [
                            { id: 'sys.user.manage', name: '用户管理', desc: '新增、编辑、禁用后台账号' },
                            { id: 'sys.role.manage', name: '角色权限', desc: '配置角色及分配权限' }
                        ],
                        SETTINGS: [
                            { id: 'sys.setting.rule', name: '规则配置', desc: '修改全局租车规则及参数' }
                        ],
                        SECURITY: [
                            { id: 'sys.log.view', name: '日志审计', desc: '查看系统操作日志及安全审计' }
                        ]
                    }
                });

                const currentRole = ref(roles.value[0]);
                const activeTab = ref('SHARING_ROUND');

                const selectRole = (role) => {
                    // 深拷贝以模拟独立编辑状态
                    currentRole.value = JSON.parse(JSON.stringify(role));
                    // 自动切换到第一个有权限的Tab
                    if (role.scopes.length > 0) {
                        activeTab.value = role.scopes[0];
                    }
                };

                const createNewRole = () => {
                    const newRole = {
                        id: Date.now(),
                        name: '新角色',
                        description: '请设置角色描述',
                        isSystem: false,
                        scopes: [],
                        permissions: []
                    };
                    roles.value.push(newRole);
                    selectRole(newRole);
                };

                const savePermissions = () => {
                    // 模拟保存
                    const index = roles.value.findIndex(r => r.id === currentRole.value.id);
                    if (index !== -1) {
                        roles.value[index] = JSON.parse(JSON.stringify(currentRole.value));
                    }
                    ElementPlus.ElMessage.success('权限配置已保存');
                };

                const resetPermissions = () => {
                    const original = roles.value.find(r => r.id === currentRole.value.id);
                    if (original) {
                        currentRole.value = JSON.parse(JSON.stringify(original));
                        ElementPlus.ElMessage.info('已重置为保存状态');
                    }
                };

                // Add/Edit Role Dialog State
                const addRoleDialogVisible = ref(false);
                const isEditRole = ref(false); // Track mode
                const roleFormRef = ref(null);
                const roleForm = reactive({
                    name: '',
                    type: '',
                    description: ''
                });

                const roleTypes = [
                    { label: '营运 (Headquarters)', value: 'HEADQUARTERS' },
                    { label: '车行 (Provider)', value: 'PROVIDER' },
                    { label: '门市 (Store)', value: 'STORE' },
                    { label: '站点 (Station)', value: 'STATION' }
                ];

                const roleRules = {
                    name: [{ required: true, message: '请输入角色名称', trigger: 'blur' }],
                    type: [{ required: true, message: '请选择角色类型', trigger: 'change' }]
                };

                const getRoleTypeLabel = (type) => {
                    let label = '';
                    const typeObj = roleTypes.find(t => t.value === type);
                    return typeObj ? typeObj.label.split(' ')[0] : type;
                };

                const openAddRoleDialog = () => {
                    isEditRole.value = false;
                    roleForm.name = '';
                    roleForm.type = '';
                    roleForm.description = '';
                    addRoleDialogVisible.value = true;
                };

                const openEditRoleDialog = () => {
                    if (currentRole.value.isSystem) return;
                    isEditRole.value = true;
                    // Populate form with current role data
                    roleForm.name = currentRole.value.name;
                    roleForm.type = currentRole.value.type;
                    roleForm.description = currentRole.value.description;
                    addRoleDialogVisible.value = true;
                };

                const deleteRole = () => {
                    if (currentRole.value.isSystem) return;
                    ElementPlus.ElMessageBox.confirm(
                        `确定要删除角色 "${currentRole.value.name}" 吗？此操作无法撤销。`,
                        '删除确认',
                        {
                            confirmButtonText: '确定删除',
                            cancelButtonText: '取消',
                            type: 'warning',
                        }
                    )
                        .then(() => {
                            const index = roles.value.findIndex(r => r.id === currentRole.value.id);
                            if (index !== -1) {
                                roles.value.splice(index, 1);
                                ElementPlus.ElMessage.success('角色已删除');
                                // Switch to first available role
                                if (roles.value.length > 0) {
                                    selectRole(roles.value[0]);
                                }
                            }
                        })
                        .catch(() => { });
                };

                const confirmRoleDialog = async () => {
                    if (!roleFormRef.value) return;
                    await roleFormRef.value.validate((valid) => {
                        if (valid) {
                            if (isEditRole.value) {
                                // Update existing role
                                const targetRole = roles.value.find(r => r.id === currentRole.value.id);
                                if (targetRole) {
                                    targetRole.name = roleForm.name;
                                    targetRole.type = roleForm.type;
                                    targetRole.description = roleForm.description;

                                    // Also update current view
                                    currentRole.value.name = roleForm.name;
                                    currentRole.value.type = roleForm.type;
                                    currentRole.value.description = roleForm.description;

                                    // Optional: If type changed, maybe we should warn about scope reset? 
                                    // For now, let's keep scopes as is unless logic demands reset.
                                }
                                ElementPlus.ElMessage.success('角色信息已更新');
                            } else {
                                // Create new role
                                const newRole = {
                                    id: Date.now(),
                                    name: roleForm.name,
                                    type: roleForm.type,
                                    description: roleForm.description || '暂无描述',
                                    isSystem: false,
                                    scopes: [],
                                    permissions: []
                                };

                                // Initialize default scopes based on type
                                if (newRole.type === 'HEADQUARTERS') newRole.scopes = ['SYSTEM_GLOBAL'];
                                if (newRole.type === 'STORE') newRole.scopes = ['STORE_STANDARD'];
                                if (newRole.type === 'STATION') newRole.scopes = ['SHARING_ROUND'];

                                roles.value.push(newRole);
                                selectRole(newRole);
                                ElementPlus.ElMessage.success('角色创建成功');
                            }
                            addRoleDialogVisible.value = false;
                        }
                    });
                };

                const goBack = () => {
                    window.location.href = 'employees.html';
                };

                return {
                    roles,
                    currentRole,
                    activeTab,
                    permissions,
                    icons,
                    selectRole,
                    createNewRole,
                    savePermissions,
                    resetPermissions,
                    // New additions
                    addRoleDialogVisible,
                    roleForm,
                    roleFormRef,
                    roleTypes,
                    roleRules,
                    getRoleTypeLabel,
                    openAddRoleDialog,
                    openEditRoleDialog,
                    deleteRole,
                    confirmRoleDialog,
                    goBack
                };
}
