    <!-- PROTOTYPE_THEME_BOOTSTRAP_START -->
    <script data-prototype-theme-bootstrap>
      (() => {
        const STORAGE_KEY = 'prototype-theme';
        const media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
        const readMode = () => {
          try {
            const v = localStorage.getItem(STORAGE_KEY);
            return v === 'light' || v === 'dark' || v === 'auto' ? v : 'auto';
          } catch (error) {
            return 'auto';
          }
        };
        const apply = () => {
          const mode = readMode();
          const resolved = mode === 'auto' && media ? (media.matches ? 'dark' : 'light') : mode;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.classList.toggle('dark', resolved === 'dark');
        };
        if (media) {
          const onSystemChange = () => {
            if (readMode() === 'auto') apply();
          };
          if (media.addEventListener) media.addEventListener('change', onSystemChange);
          else if (media.addListener) media.addListener(onSystemChange);
        }
        window.ElementPrototypeTheme = {
          get mode() {
            return readMode();
          },
          set(mode) {
            if (mode !== 'light' && mode !== 'dark' && mode !== 'auto') return;
            try {
              localStorage.setItem(STORAGE_KEY, mode);
            } catch (error) {
              /* 隐私模式下仅本轮生效 */
            }
            apply();
          },
          apply,
        };
        apply();
      })();
    </script>

    <script data-prototype-menu-icon-renderer>
      (() => {
        let renderQueued = false;
        const renderMenuIcons = () => {
          if (!window.Vue || !window.ElementPlusIconsVue) return;
          document.querySelectorAll('[data-prototype-menu-icon]').forEach((host) => {
            const iconName = host.getAttribute('data-prototype-menu-icon') || 'Document';
            if (host.dataset.prototypeMenuIconRendered === iconName) return;
            const icon = window.ElementPlusIconsVue[iconName] || window.ElementPlusIconsVue.Document;
            if (!icon) return;
            window.Vue.render(window.Vue.h(icon), host);
            host.dataset.prototypeMenuIconRendered = iconName;
          });
        };
        const scheduleRender = () => {
          if (renderQueued) return;
          renderQueued = true;
          /* 不使用 requestAnimationFrame：隐藏标签页和无头截图环境下它不会触发。 */
          setTimeout(() => {
            renderQueued = false;
            renderMenuIcons();
          }, 0);
        };
        /* 导航改为 v-for、条件渲染或更换图标名时，Vue 会重建或更新这些节点；观察导航区补渲染。 */
        const observeShellNav = () => {
          const nav = document.querySelector('[data-prototype-shell="navigation"]');
          if (!nav) return;
          new MutationObserver(scheduleRender).observe(nav, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ['data-prototype-menu-icon'],
          });
        };
        const start = () => {
          renderMenuIcons();
          observeShellNav();
        };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', start, { once: true });
        } else {
          start();
        }
      })();
    </script>

          try {
            await new Promise((resolve) => setTimeout(resolve, 300));
            if (dialogMode.value === 'create') {
              const nextSequence = Math.max(0, ...rows.value.map((item) => item.id)) + 1;
              rows.value.unshift({
                id: nextSequence,
                code: `ITEM-${String(nextSequence).padStart(3, '0')}`,
                name: form.name,
                category: form.category,
                owner: '陈晓',
                status: form.enabled ? 'enabled' : 'disabled',
                description: form.description || '暂无说明',
                source: '手动上传',
                updatedAt: '2026-07-13 14:30',
              });
            } else {
              const target = rows.value.find((item) => item.id === editingId.value);
              if (target) {
                target.name = form.name;
                target.category = form.category;
                target.status = form.enabled ? 'enabled' : 'disabled';
                target.description = form.description || '暂无说明';
              }
            }
            dialogVisible.value = false;
            ElMessage.success('保存成功');
          } finally {
            submitting.value = false;
          }
        }

        async function removeRow(row) {
          const confirmed = await ElMessageBox.confirm(`确认删除“${row.name}”吗？`, '删除确认', {
            type: 'warning',
          })
            .then(() => true)
            .catch(() => false);
          if (!confirmed) return;
          rows.value = rows.value.filter((item) => item.id !== row.id);
          ElMessage.success('删除成功');
        }

        function exportRows() {
          ElMessage.success('导出任务已创建');
        }

        function handleDemoBack() {
          ElMessage.info('返回上一页');
        }

        function showDemoAction(action) {
          ElMessage.info(`${action}：结构示例未连接真实数据`);
        }

        function saveDemoDraft() {
          ElMessage.success('草稿已保存');
        }

        function submitDemoOrder() {
          if (!orderDraft.customer || !orderDraft.pickupStore || !orderDraft.vehicleGroup) {
            ElMessage.warning('请先完成必填信息');
            return;
          }
          ElMessage.success('订单已建立');
        }

        return {
          Platform: ElementPlusIconsVue.Platform,
          Document: ElementPlusIconsVue.Document,
          Setting: ElementPlusIconsVue.Setting,
          Search: ElementPlusIconsVue.Search,
          Refresh: ElementPlusIconsVue.Refresh,
          Plus: ElementPlusIconsVue.Plus,
          Download: ElementPlusIconsVue.Download,
          ArrowLeft: ElementPlusIconsVue.ArrowLeft,
          demoMode,
          demoModeOptions,
          themeMode,
          themeModeOptions,
          setThemeMode,
          orderDraft,
          rentalRangeSummary,
          filters,
          pagination,
          dialogVisible,
          dialogMode,
          submitting,
          formRef,
          form,
          formRules,
          filteredRows,
          pagedRows,
          resetFilters,
          openCreateDialog,
          openEditDialog,
          submitForm,
          removeRow,
          exportRows,
          handleDemoBack,
          showDemoAction,
          saveDemoDraft,
          submitDemoOrder,
        };
      }
      /* PAGE_LOGIC_END */

      /* TEMPLATE-LOCK: PROTOTYPE_BOOTSTRAP_START。页面启动代码，不得修改或放入业务逻辑。 */
      const app = Vue.createApp({ setup: pageSetup });
      app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
      app.mount('#app');
      /* PROTOTYPE_BOOTSTRAP_END */
    </script>
