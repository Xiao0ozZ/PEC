<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="prototype-title" content="业务页面原型" />
    <meta name="prototype-path" content="/admin/business-page" />
    <meta name="prototype-section" content="workspace" />
    <meta name="prototype-icon" content="Document" />
    <title>业务页面原型</title>

    <!--
      PROTOTYPE_AI_PROTOCOL_START
      这是一个可独立打开的 HTML 原型模板，不依赖构建工具、框架或第三方运行时。
      业务页面只编辑 PAGE_STYLE、PAGE_CONTENT、PAGE_OVERLAYS 和 PAGE_LOGIC 四个区域。
      页面最终由平台公共壳承载；模板自身仍然可以直接在浏览器中预览。
      PROTOTYPE_AI_PROTOCOL_END
    -->

    <!-- PROTOTYPE_STYLE_DEPENDENCIES_START -->
    <!-- 模板只使用原生 CSS；平台承载时会注入统一的主题变量。 -->
    <!-- PROTOTYPE_STYLE_DEPENDENCIES_END -->

    <!-- PROTOTYPE_THEME_BRIDGE_START -->
    <script>
      (() => {
        const root = document.documentElement;
        const themeVariables = [
          '--app-color-primary',
          '--app-color-primary-hover',
          '--app-color-primary-active',
          '--app-color-bg-layout',
          '--app-color-bg-container',
          '--app-color-bg-elevated',
          '--app-color-text',
          '--app-color-text-secondary',
          '--app-color-border',
        ];

        function readHostDocument() {
          try {
            return window.parent !== window ? window.parent.document : document;
          } catch {
            return document;
          }
        }

        function syncTheme() {
          const hostDocument = readHostDocument();
          const hostRoot = hostDocument.documentElement;
          const theme =
            hostRoot.getAttribute('data-theme') || (hostRoot.classList.contains('dark') ? 'dark' : 'light');
          root.setAttribute('data-theme', theme);
          const hostStyles = window.getComputedStyle(hostRoot);
          themeVariables.forEach((name) => {
            const value = hostStyles.getPropertyValue(name).trim();
            if (value) root.style.setProperty(name, value);
          });
        }

        syncTheme();
        try {
          const hostRoot = window.parent !== window ? window.parent.document.documentElement : null;
          if (hostRoot) {
            new MutationObserver(syncTheme).observe(hostRoot, {
              attributes: true,
              attributeFilter: ['class', 'data-theme', 'style'],
            });
          }
        } catch {
          // 独立预览或跨域承载时无法观察宿主，使用模板自己的浅色主题即可。
        }
      })();
    </script>
    <!-- PROTOTYPE_THEME_BRIDGE_END -->

    <!-- PAGE_STYLE_START -->
    <style>
      :root {
        color-scheme: light;
        --app-color-primary: #1677ff;
        --app-color-primary-hover: #4096ff;
        --app-color-primary-active: #0958d9;
        --app-color-bg-layout: #f5f7fb;
        --app-color-bg-container: #ffffff;
        --app-color-bg-elevated: #ffffff;
        --app-color-text: #1f2937;
        --app-color-text-secondary: #667085;
        --app-color-border: #e5e7eb;
        --prototype-radius-sm: 8px;
        --prototype-radius-md: 14px;
        --prototype-radius-lg: 22px;
        --prototype-shadow-sm: 0 8px 24px rgb(15 23 42 / 6%);
      }

      html[data-theme='dark'] {
        color-scheme: dark;
        --app-color-bg-layout: #0f172a;
        --app-color-bg-container: #172033;
        --app-color-bg-elevated: #202b40;
        --app-color-text: #f3f4f6;
        --app-color-text-secondary: #aab4c4;
        --app-color-border: #334155;
        --prototype-shadow-sm: 0 8px 24px rgb(0 0 0 / 24%);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--app-color-bg-layout);
        color: var(--app-color-text);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        font-size: 14px;
        line-height: 1.6;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .prototype-page {
        min-height: 100vh;
        padding: 24px;
        background: var(--app-color-bg-layout);
      }

      .prototype-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        max-width: 1120px;
        margin: 0 auto 22px;
        padding: 14px 18px;
        border: 1px solid color-mix(in srgb, var(--app-color-border) 78%, transparent);
        border-radius: var(--prototype-radius-lg);
        background: color-mix(in srgb, var(--app-color-bg-elevated) 86%, transparent);
        box-shadow: var(--prototype-shadow-sm);
        backdrop-filter: blur(18px) saturate(1.15);
      }

      .prototype-topbar__brand,
      .prototype-topbar__meta {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .prototype-topbar__brand {
        color: var(--app-color-text);
        font-weight: 700;
      }

      .prototype-topbar__mark {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 10px;
        background: var(--app-color-primary);
        color: #fff;
        font-weight: 700;
      }

      .prototype-topbar__meta {
        color: var(--app-color-text-secondary);
        font-size: 13px;
      }

      .prototype-main {
        max-width: 1120px;
        margin: 0 auto;
      }

      .prototype-content {
        padding: clamp(22px, 4vw, 42px);
        border: 1px solid color-mix(in srgb, var(--app-color-border) 72%, transparent);
        border-radius: var(--prototype-radius-lg);
        background: color-mix(in srgb, var(--app-color-bg-container) 96%, transparent);
        box-shadow: var(--prototype-shadow-sm);
      }

      .prototype-content__header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }

      .prototype-content h1,
      .prototype-content h2,
      .prototype-content h3,
      .prototype-content p {
        margin-top: 0;
      }

      .prototype-content h1 {
        margin-bottom: 8px;
        font-size: clamp(24px, 3vw, 34px);
        line-height: 1.25;
        letter-spacing: -0.02em;
      }

      .prototype-content__description {
        margin-bottom: 0;
        color: var(--app-color-text-secondary);
      }

      .prototype-button {
        min-height: 38px;
        padding: 0 16px;
        border-radius: 11px;
        background: var(--app-color-primary);
        color: #fff;
        font-weight: 600;
        transition:
          background-color 160ms ease,
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      .prototype-button:hover {
        background: var(--app-color-primary-hover);
        box-shadow: 0 8px 18px color-mix(in srgb, var(--app-color-primary) 22%, transparent);
        transform: translateY(-1px);
      }

      .prototype-button:active {
        background: var(--app-color-primary-active);
        transform: translateY(0);
      }

      .prototype-button--quiet {
        background: color-mix(in srgb, var(--app-color-primary) 10%, transparent);
        color: var(--app-color-primary);
      }

      .prototype-button--quiet:hover {
        background: color-mix(in srgb, var(--app-color-primary) 16%, transparent);
      }

      .prototype-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }

      .prototype-field {
        min-height: 38px;
        padding: 0 12px;
        border: 1px solid var(--app-color-border);
        border-radius: var(--prototype-radius-sm);
        outline: 0;
        background: var(--app-color-bg-elevated);
        color: var(--app-color-text);
      }

      .prototype-field:focus {
        border-color: var(--app-color-primary);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--app-color-primary) 15%, transparent);
      }

      .prototype-field--search {
        min-width: min(320px, 100%);
        flex: 1 1 260px;
      }

      .prototype-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--app-color-border);
      }

      .prototype-tab {
        position: relative;
        padding: 10px 14px;
        background: transparent;
        color: var(--app-color-text-secondary);
        font-weight: 600;
      }

      .prototype-tab::after {
        position: absolute;
        right: 12px;
        bottom: -1px;
        left: 12px;
        height: 2px;
        border-radius: 2px;
        background: transparent;
        content: '';
      }

      .prototype-tab[aria-selected='true'] {
        color: var(--app-color-primary);
      }

      .prototype-tab[aria-selected='true']::after {
        background: var(--app-color-primary);
      }

      .prototype-table-wrap {
        overflow-x: auto;
        border: 1px solid var(--app-color-border);
        border-radius: var(--prototype-radius-md);
      }

      .prototype-table {
        width: 100%;
        min-width: 640px;
        border-collapse: collapse;
      }

      .prototype-table th,
      .prototype-table td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--app-color-border);
        text-align: left;
      }

      .prototype-table th {
        background: color-mix(in srgb, var(--app-color-bg-layout) 76%, transparent);
        color: var(--app-color-text-secondary);
        font-size: 12px;
        font-weight: 600;
      }

      .prototype-table tr:last-child td {
        border-bottom: 0;
      }

      .prototype-table tbody tr {
        transition: background-color 160ms ease;
      }

      .prototype-table tbody tr:hover {
        background: color-mix(in srgb, var(--app-color-primary) 5%, transparent);
      }

      .prototype-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border-radius: 999px;
        background: color-mix(in srgb, #16a34a 12%, transparent);
        color: #16a34a;
        font-size: 12px;
        font-weight: 600;
      }

      .prototype-status::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        content: '';
      }

      .prototype-empty {
        padding: 42px 20px;
        color: var(--app-color-text-secondary);
        text-align: center;
      }

      .prototype-toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 2;
        max-width: min(360px, calc(100vw - 48px));
        padding: 12px 16px;
        border: 1px solid color-mix(in srgb, var(--app-color-primary) 30%, var(--app-color-border));
        border-radius: 12px;
        background: var(--app-color-bg-elevated);
        box-shadow: var(--prototype-shadow-sm);
        color: var(--app-color-text);
      }

      .prototype-dialog {
        width: min(520px, calc(100vw - 32px));
        padding: 0;
        border: 1px solid var(--app-color-border);
        border-radius: var(--prototype-radius-lg);
        background: var(--app-color-bg-elevated);
        color: var(--app-color-text);
        box-shadow: 0 24px 80px rgb(15 23 42 / 24%);
      }

      .prototype-dialog::backdrop {
        background: rgb(15 23 42 / 35%);
        backdrop-filter: blur(3px);
      }

      .prototype-dialog__body {
        padding: 24px;
      }

      .prototype-dialog__actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 22px;
      }

      @media (max-width: 680px) {
        .prototype-page {
          padding: 12px;
        }

        .prototype-topbar,
        .prototype-content__header {
          align-items: flex-start;
          flex-direction: column;
        }

        .prototype-topbar {
          margin-bottom: 14px;
        }

        .prototype-content {
          padding: 20px 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <!-- PAGE_STYLE_END -->
  </head>
  <body>
    <!-- PROTOTYPE_SHELL_START -->
    <div class="prototype-page">
      <header class="prototype-topbar" aria-label="原型页顶栏">
        <div class="prototype-topbar__brand">
          <span class="prototype-topbar__mark" aria-hidden="true">◆</span>
          <span>业务原型</span>
        </div>
        <div class="prototype-topbar__meta">
          <span>HTML 页面</span>
          <span aria-hidden="true">·</span>
          <span>可独立预览</span>
        </div>
      </header>

      <main class="prototype-main" data-page-content data-business-content>
        <!-- [AI-EDIT] PAGE_CONTENT_START -->
        <section class="prototype-content" aria-labelledby="page-title">
          <div class="prototype-content__header">
            <div>
              <h1 id="page-title">业务页面原型</h1>
              <p class="prototype-content__description">在这里替换页面标题、说明、筛选项和业务数据。</p>
            </div>
            <button class="prototype-button" type="button" data-dialog-open>新建记录</button>
          </div>

          <div class="prototype-toolbar" aria-label="筛选工具栏">
            <input
              class="prototype-field prototype-field--search"
              type="search"
              placeholder="搜索名称或编号"
              data-search
            />
            <select class="prototype-field" data-status-filter aria-label="状态筛选">
              <option value="all">全部状态</option>
              <option value="进行中">进行中</option>
              <option value="已完成">已完成</option>
            </select>
            <button class="prototype-button prototype-button--quiet" type="button" data-reset>重置</button>
          </div>

          <div class="prototype-tabs" role="tablist" aria-label="记录分类">
            <button class="prototype-tab" type="button" role="tab" aria-selected="true" data-tab="all">
              全部
            </button>
            <button class="prototype-tab" type="button" role="tab" aria-selected="false" data-tab="进行中">
              进行中
            </button>
            <button class="prototype-tab" type="button" role="tab" aria-selected="false" data-tab="已完成">
              已完成
            </button>
          </div>

          <div class="prototype-table-wrap">
            <table class="prototype-table">
              <thead>
                <tr>
                  <th scope="col">名称</th>
                  <th scope="col">负责人</th>
                  <th scope="col">更新时间</th>
                  <th scope="col">状态</th>
                  <th scope="col">操作</th>
                </tr>
              </thead>
              <tbody data-records>
                <tr data-record data-status="进行中">
                  <td>客户资料整理</td>
                  <td>林晓</td>
                  <td>2026-09-12 09:30</td>
                  <td><span class="prototype-status">进行中</span></td>
                  <td>
                    <button class="prototype-button prototype-button--quiet" type="button" data-dialog-open>
                      查看
                    </button>
                  </td>
                </tr>
                <tr data-record data-status="已完成">
                  <td>月度经营复盘</td>
                  <td>周宁</td>
                  <td>2026-09-11 18:10</td>
                  <td><span class="prototype-status">已完成</span></td>
                  <td>
                    <button class="prototype-button prototype-button--quiet" type="button" data-dialog-open>
                      查看
                    </button>
                  </td>
                </tr>
                <tr data-record data-status="进行中">
                  <td>服务工单跟进</td>
                  <td>陈默</td>
                  <td>2026-09-10 14:20</td>
                  <td><span class="prototype-status">进行中</span></td>
                  <td>
                    <button class="prototype-button prototype-button--quiet" type="button" data-dialog-open>
                      查看
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
            <div class="prototype-empty" data-empty hidden>没有符合条件的记录</div>
          </div>
        </section>
        <!-- PAGE_CONTENT_END -->
      </main>
    </div>
    <!-- PROTOTYPE_SHELL_END -->

    <!-- [AI-EDIT] PAGE_OVERLAYS_START -->
    <dialog class="prototype-dialog" data-page-overlay="detail" aria-labelledby="dialog-title">
      <div class="prototype-dialog__body">
        <h2 id="dialog-title">记录详情</h2>
        <p>这是页面浮层区域。可以在这里放置确认、编辑、抽屉或其他临时交互。</p>
        <div class="prototype-dialog__actions">
          <button class="prototype-button prototype-button--quiet" type="button" data-dialog-close>
            关闭
          </button>
          <button class="prototype-button" type="button" data-dialog-confirm>确认</button>
        </div>
      </div>
    </dialog>
    <div class="prototype-toast" role="status" data-toast hidden></div>
    <!-- PAGE_OVERLAYS_END -->

    <script id="prototype-page-manifest" type="application/json">
      {
        "templateVersion": 1,
        "scriptMode": "native",
        "pageKey": "business-page",
        "pageTitle": "业务页面原型",
        "menuTitle": "业务页面原型",
        "menuSection": "workspace",
        "menuIcon": "Document",
        "menu": true,
        "client": "admin",
        "routePath": "/admin/business-page",
        "renderMode": "content-only",
        "dependencies": [],
        "assets": []
      }
    </script>

    <!-- PROTOTYPE_SCRIPT_DEPENDENCIES_START -->
    <!-- 页面逻辑使用浏览器原生 API，不加载外部脚本。 -->
    <!-- PROTOTYPE_SCRIPT_DEPENDENCIES_END -->

    <script>
      // [AI-EDIT] PAGE_LOGIC_START
      (() => {
        const records = [...document.querySelectorAll('[data-record]')];
        const search = document.querySelector('[data-search]');
        const statusFilter = document.querySelector('[data-status-filter]');
        const empty = document.querySelector('[data-empty]');
        const dialog = document.querySelector('.prototype-dialog');
        const toast = document.querySelector('[data-toast]');
        let activeTab = 'all';
        let toastTimer;

        function applyFilters() {
          const query = String(search?.value || '')
            .trim()
            .toLowerCase();
          const status = String(statusFilter?.value || 'all');
          let visibleCount = 0;
          records.forEach((record) => {
            const matchesQuery = !query || record.textContent.toLowerCase().includes(query);
            const recordStatus = record.dataset.status || '';
            const matchesStatus = status === 'all' || recordStatus === status;
            const matchesTab = activeTab === 'all' || recordStatus === activeTab;
            const visible = matchesQuery && matchesStatus && matchesTab;
            record.hidden = !visible;
            if (visible) visibleCount += 1;
          });
          if (empty) empty.hidden = visibleCount !== 0;
        }

        function showToast(message) {
          if (!toast) return;
          toast.textContent = message;
          toast.hidden = false;
          window.clearTimeout(toastTimer);
          toastTimer = window.setTimeout(() => {
            toast.hidden = true;
          }, 2400);
        }

        search?.addEventListener('input', applyFilters);
        statusFilter?.addEventListener('change', applyFilters);
        document.querySelector('[data-reset]')?.addEventListener('click', () => {
          if (search) search.value = '';
          if (statusFilter) statusFilter.value = 'all';
          activeTab = 'all';
          document.querySelectorAll('[data-tab]').forEach((tab) => {
            tab.setAttribute('aria-selected', String(tab.dataset.tab === activeTab));
          });
          applyFilters();
        });

        document.querySelectorAll('[data-tab]').forEach((tab) => {
          tab.addEventListener('click', () => {
            activeTab = tab.dataset.tab || 'all';
            document.querySelectorAll('[data-tab]').forEach((item) => {
              item.setAttribute('aria-selected', String(item === tab));
            });
            applyFilters();
          });
        });

        document.querySelectorAll('[data-dialog-open]').forEach((button) => {
          button.addEventListener('click', () => dialog?.showModal());
        });
        document.querySelector('[data-dialog-close]')?.addEventListener('click', () => dialog?.close());
        document.querySelector('[data-dialog-confirm]')?.addEventListener('click', () => {
          dialog?.close();
          showToast('操作已确认');
        });
        dialog?.addEventListener('click', (event) => {
          if (event.target === dialog) dialog.close();
        });

        applyFilters();
      })();
      // PAGE_LOGIC_END
    </script>

    <!-- PROTOTYPE_BOOTSTRAP_START -->
    <!-- 原生脚本在文档末尾执行，无需额外启动器。 -->
    <!-- PROTOTYPE_BOOTSTRAP_END -->
  </body>
</html>
